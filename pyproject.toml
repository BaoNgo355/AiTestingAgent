[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aitest"
version = "4.0.0"
description = "CLI AI Agent hỗ trợ tự động sinh, cải thiện và đánh giá Unit Test Python bằng Google Antigravity Python SDK"
requires-python = ">=3.10"
dependencies = [
    "google-antigravity>=0.1.24",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
aitest = "aitest.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["aitest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".aitest_backup", ".aitest_logs", "generated_tests", ".venv", "venv"]
